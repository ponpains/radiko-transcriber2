        String writeMethod = '''    private boolean writeRecognizerBytesForGeneration(byte[] data, int generation,
                                                        long rawStart, long rawEnd) {
        if (data == null || data.length == 0) return true;
        int offset = 0;
        while (running && offset < data.length && !drainComplete) {
            if (!recognizerReady || generation != recognizerGeneration) {
                diag("feed_aborted", "feedGeneration=" + generation
                        + ";activeGeneration=" + recognizerGeneration
                        + ";rawStart=" + rawStart + ";rawEnd=" + rawEnd
                        + ";encodedSent=" + offset + "/" + data.length);
                return false;
            }
            OutputStream target;
            synchronized (pipeLock) { target = pipeOut; }
            if (target == null) {
                sleepQuietly(20L);
                continue;
            }
            int len = Math.min(4096, data.length - offset);
            try {
                target.write(data, offset, len);
                offset += len;
            } catch (IOException e) {
                diag("feeder_pipe_retry", "feedGeneration=" + generation
                        + ";activeGeneration=" + recognizerGeneration
                        + ";rawStart=" + rawStart + ";rawEnd=" + rawEnd
                        + ";encodedSent=" + offset
                        + ";error=" + e.getClass().getSimpleName());
                return false;
            }
        }
        if (offset < data.length) return false;
        paceRecognizerFeed(data.length, rawEnd);
        recordFeedDiagnostic(generation, rawStart, rawEnd, data.length);
        return true;
    }

    private void paceRecognizerFeed(int encodedBytes, long rawEnd) {
        long backlogRaw = Math.max(0L, spoolBytesWritten - rawEnd);
        boolean catchingUp = replayCatchupUntilOffset >= 0L && rawEnd < replayCatchupUntilOffset;
        boolean buffered = backlogRaw >= rawBytesForMs(1100L);
        if (catchingUp || buffered) {
            double encodedMs = encodedBytes * 1000.0 / (SAMPLE_RATE * 2.0);
            long wait = Math.round(encodedMs / REPLAY_CATCHUP_RATE);
            if (wait > 0L) sleepQuietly(Math.min(900L, wait));
        }
        if (replayCatchupUntilOffset >= 0L && rawEnd >= replayCatchupUntilOffset) {
            diag("recognizer_replay_caught_up", "atOffset=" + rawEnd
                    + ";activeGeneration=" + recognizerGeneration);
            replayCatchupUntilOffset = -1L;
        }
    }

    private void recordFeedDiagnostic(int generation, long rawStart, long rawEnd, int encodedBytes) {
        long now = System.currentTimeMillis();
        if (feedDiagnosticStartOffset < 0L) feedDiagnosticStartOffset = rawStart;
        feedDiagnosticEndOffset = rawEnd;
        feedDiagnosticEncodedBytes += Math.max(0, encodedBytes);
        if (lastFeedDiagnosticAt == 0L) lastFeedDiagnosticAt = now;
        if (now - lastFeedDiagnosticAt < 2000L) return;
        diag("recognizer_feed", "generation=" + generation
                + ";startOffset=" + feedDiagnosticStartOffset
                + ";endOffset=" + feedDiagnosticEndOffset
                + ";encodedBytes=" + feedDiagnosticEncodedBytes
                + ";safeOffset=" + safeCommittedOffset
                + ";backlogMs=" + bufferedBacklogMs());
        feedDiagnosticStartOffset = rawEnd;
        feedDiagnosticEndOffset = rawEnd;
        feedDiagnosticEncodedBytes = 0L;
        lastFeedDiagnosticAt = now;
    }

