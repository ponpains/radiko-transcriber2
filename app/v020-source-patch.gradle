// v0.20 stabilization + show-structure patch.
// Based on the v0.19 #8 diagnostic: replay was correct in principle but could rewind tens of
// seconds and then burst-feed it far faster than real time, producing NETWORK/disconnect loops.

def replaceRange020 = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.20 patch: start marker not found: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.20 patch: end marker not found: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

