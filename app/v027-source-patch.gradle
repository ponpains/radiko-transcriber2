// v0.27: fixes found in the v0.26 #15 diagnostic without touching the stable v0.21
// capture/checkpoint/replay transport. Focus: resumed-session timestamps, usable selective
// re-recognition results, cold-open recovery, local replay cleanup, and strict music search gating.

def replaceRange027 = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.27 patch: start marker missing: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.27 patch: end marker missing: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

