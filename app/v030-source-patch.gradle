        if (!running || sourceFinished) return;
        sourceFinished = true;
        captureActive = false;
        frozenDurationMs = currentDurationMs();

        // stop() unblocks AudioRecord.read(). Wait for the capture loop to exit before closing or
        // trimming its spool, so a final read can never race the truncation step.
        Thread endingCapture = captureThread;
        try { if (recorder != null) recorder.stop(); } catch (Exception ignored) {}
        if (endingCapture != null && endingCapture != Thread.currentThread()) {
            try { endingCapture.join(1200L); } catch (InterruptedException ignored) {
                Thread.currentThread().interrupt();
            }
        }
        diag("capture_join_v030", "alive=" + (endingCapture != null && endingCapture.isAlive())
                + ";written=" + spoolBytesWritten + ";lastAudibleBytes=" + lastAudibleSpoolBytesV030);

        try { if (recorder != null) recorder.release(); } catch (Exception ignored) {}
        recorder = null;
        try { if (projection != null) projection.stop(); } catch (Exception ignored) {}
        projection = null;

        synchronized (spoolLock) {
            try { if (spoolOut != null) spoolOut.close(); } catch (Exception ignored) {}
            spoolOut = null;
        }
        trimFinalSilenceFromSpool();
        diag("capture_finish", "reason=" + reason + ";durationMs=" + frozenDurationMs
                + ";written=" + spoolBytesWritten + ";consumed=" + spoolBytesConsumed
                + ";lastAudibleBytes=" + lastAudibleSpoolBytesV030);
        broadcast(message, true);
        updateNotification(message);

        if (spoolBytesConsumed >= spoolBytesWritten) markDrainComplete();
        else mainHandler.postDelayed(() -> {
            if (running && sourceFinished) broadcast(bufferedStatusText(), true);
        }, 500L);
    }

'''
