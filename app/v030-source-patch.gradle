        String trimEnd = "    private void markDrainComplete() {"
        if (!s.contains("audio_tail_trim_v030")) {
            String trimMethod = '''    private void trimFinalSilenceFromSpool() {
        if (spoolFile == null || spoolBytesWritten <= 0L) return;
        long audibleEnd = Math.max(0L, Math.min(lastAudibleSpoolBytesV030, spoolBytesWritten));
        if (audibleEnd <= 0L) return;

        // Preserve 900 ms after the last chunk that actually crossed the audible threshold. This is
        // based on captured byte position, not wall-clock time, so scheduler/AudioRecord races cannot
        // make us cut real audio. Never truncate bytes the recognizer has already consumed either.
        long tailBytes = Math.round(900.0 * SAMPLE_RATE * 2.0 / 1000.0);
        tailBytes -= tailBytes & 1L;
        long requestedTarget = Math.min(spoolBytesWritten, audibleEnd + tailBytes);
        long target = Math.max(spoolBytesConsumed, requestedTarget);
        if (target >= spoolBytesWritten) {
            diag("audio_tail_trim_v030", "trimmedBytes=0;written=" + spoolBytesWritten
                    + ";consumed=" + spoolBytesConsumed + ";audibleEnd=" + audibleEnd);
            return;
        }

        long before = spoolBytesWritten;
        try (RandomAccessFile raf = new RandomAccessFile(spoolFile, "rw")) {
            raf.setLength(target);
            spoolBytesWritten = target;
            long trimmedBytes = before - target;
            long trimmedRawMs = Math.round(trimmedBytes * 1000.0 / (SAMPLE_RATE * 2.0));
            frozenDurationMs = Math.max(0L,
                    frozenDurationMs - Math.round(trimmedRawMs * playbackSpeed));
            diag("audio_tail_trim_v030", "trimmedBytes=" + trimmedBytes
                    + ";trimmedRawMs=" + trimmedRawMs + ";newBytes=" + target
                    + ";consumed=" + spoolBytesConsumed + ";audibleEnd=" + audibleEnd
                    + ";durationMs=" + frozenDurationMs);
        } catch (Exception ex) {
            diag("audio_tail_trim_v030_error", ex.getClass().getSimpleName());
        }
    }

