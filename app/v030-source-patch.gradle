// v0.30: harden learned corrections, preserve the true audio tail, and spend re-recognition only
// on high-value suspicious segments. Applied after v0.29.
def replaceRange030 = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.30: start marker missing: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.30: end marker missing: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

