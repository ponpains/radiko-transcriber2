// v0.22: stability-first precision layer.
// Keep v0.21's checkpoint-flush transport unchanged. Add only fail-open background entity
// verification, fixed show templates, verified proper-noun scoring and a final idempotent text pass.

def replaceRange022 = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.22 patch: start marker not found: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.22 patch: end marker not found: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

