                    "            if (!beforePrecision.equals(finalText))\n" +
                    "                diag(\"v022_final_precision_pass\", \"beforeChars=\" + beforePrecision.length()\n" +
                    "                        + \";afterChars=\" + finalText.length());\n" +
                    "            diag(\"online_entity_stats\", OnlineEntityVerifier.stats());\n" +
                    "        }")
        }

        serviceFile.write(s, "UTF-8")

        File episodeFile = file("src/main/java/com/example/radikotranscriber/EpisodeStore.java")
