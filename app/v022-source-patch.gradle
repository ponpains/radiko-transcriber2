                    "                    episodeTitle + \" \" + episodeHints);\n" +
                    "            score += KerekereVerifiedLexicon.scoreCandidate(program, c, finalText);\n" +
                    "            score += OnlineEntityVerifier.scoreCandidate(program, c);")
        }

        // Observe only selected recognizer chunks. This method queues work and returns immediately;
        // capture/feed threads never wait for HTTP.
        if (!s.contains("OnlineEntityVerifier.observe(program, finalText")) {
            s = s.replace(
                    "    private void commitText(String rawSegment, String selected, String source) {\n        if (selected == null) return;",
                    "    private void commitText(String rawSegment, String selected, String source) {\n" +
