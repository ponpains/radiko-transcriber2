                    "            OnlineEntityVerifier.beginEpisode(this, program,\n" +
                    "                    episodeTitle + \" \" + episodeHints, \"internal\".equals(mode),\n" +
                    "                    (kind, detail) -> diag(kind, detail));")
        }

        // Give verified spellings a measured candidate-scoring advantage. Online aliases only enter
        // here after a high-confidence background verification, so network failure cannot hurt ASR.
        if (!s.contains("KerekereVerifiedLexicon.scoreCandidate")) {
            s = s.replace(
                    "            score += KerekereProgramStructure.scoreCandidate(program, c, finalText,\n                    episodeTitle + \" \" + episodeHints);",
