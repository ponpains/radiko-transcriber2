// v0.31: make episode metadata durable across Activity recreation and prevent two concrete
// N-best regressions seen in the v0.30 diagnostic. Applied last, after v0.30 follow-up.
def replaceOnce031 = { String text, String oldText, String newText, String label ->
    if (text.contains(newText)) return text
    if (!text.contains(oldText)) throw new GradleException("v0.31: marker missing: " + label)
    return text.replace(oldText, newText)
}

tasks.named("preBuild").configure {
    doLast {
        // -----------------------------------------------------------------------------
        // 1) Metadata durability.
        // v0.30 can recreate MainActivity while TranscribeService is alive. syncRuntimeState()
        // restored only the episode id, leaving title/url blank. After the service stopped,
        // saveCurrentEdits() could then persist those blank widgets over valid DB metadata.
        // Bind the running episode's metadata from DB, autosave real edits, and keep an unsaved
        // new-episode draft in app-private SharedPreferences until the row is created.
        // -----------------------------------------------------------------------------
        File mainFile = file("src/main/java/com/example/radikotranscriber/MainActivity.java")
        String m = mainFile.getText("UTF-8")

        if (!m.contains("metaSaveHandlerV031")) {
            String fields = '''    private String lastServiceText = "";
    private long lastUiDiagnosticAt = 0L;
'''
            String fieldsNew = '''    private String lastServiceText = "";
    private long lastUiDiagnosticAt = 0L;
    private boolean applyingMetaUiV031 = false;
    private final Handler metaSaveHandlerV031 = new Handler(Looper.getMainLooper());
    private final Runnable metaSaveRunnableV031 = () -> saveMetadataV031("debounce");
'''
            m = replaceOnce031(m, fields, fieldsNew, "metadata fields")
        }

        if (!m.contains("setupMetadataAutosaveV031();")) {
            String init = '''        newEpisode();
        syncRuntimeState();

        if (Build.VERSION.SDK_INT >= 33'''
            String initNew = '''        newEpisode();
        syncRuntimeState();
        setupMetadataAutosaveV031();
        if (!serviceRunning && activeEpisodeId <= 0) restoreDraftMetadataV031();

        if (Build.VERSION.SDK_INT >= 33'''
            m = replaceOnce031(m, init, initNew, "metadata autosave init")
        }

        if (!m.contains("private void setupMetadataAutosaveV031()")) {
            String marker = '''    private void requestStart(int mode) {'''
            if (!m.contains(marker)) throw new GradleException("v0.31: metadata methods marker missing")
            String methods = '''    private void setupMetadataAutosaveV031() {
        TextWatcher watcher = new TextWatcher() {
            @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
            @Override public void onTextChanged(CharSequence s, int start, int before, int count) {}
            @Override public void afterTextChanged(Editable s) {
                if (applyingMetaUiV031) return;
                updateCurrentLabel();
                metaSaveHandlerV031.removeCallbacks(metaSaveRunnableV031);
                if (activeEpisodeId > 0) {
                    metaSaveHandlerV031.postDelayed(metaSaveRunnableV031, 350L);
                } else {
                    saveDraftMetadataV031();
                }
            }
        };
        programInput.addTextChangedListener(watcher);
        episodeInput.addTextChangedListener(watcher);
        urlInput.addTextChangedListener(watcher);
    }

    private void saveMetadataV031(String reason) {
        if (store == null || applyingMetaUiV031) return;
        String p = programInput == null ? "" : programInput.getText().toString().trim();
        String t = episodeInput == null ? "" : episodeInput.getText().toString().trim();
        String u = urlInput == null ? "" : urlInput.getText().toString().trim();
        if (activeEpisodeId <= 0) {
            saveDraftMetadataV031();
            return;
        }
        store.updateMeta(activeEpisodeId, p, t, u);
        clearDraftMetadataV031();
        if (diagnostics != null) diagnostics.log(activeEpisodeId, "ui_meta_saved_v031",
                "reason=" + reason + ";programChars=" + p.length()
                        + ";titleChars=" + t.length() + ";urlChars=" + u.length()
                        + ";running=" + serviceRunning);
    }

    private void bindMetadataFromStoreV031(long episodeId, String reason) {
        if (store == null || episodeId <= 0) return;
        EpisodeStore.Episode e = store.getEpisode(episodeId);
        if (e == null) return;
        metaSaveHandlerV031.removeCallbacks(metaSaveRunnableV031);
        applyingMetaUiV031 = true;
        try {
            programInput.setText(e.program == null ? "" : e.program);
            episodeInput.setText(e.title == null ? "" : e.title);
            urlInput.setText(e.url == null ? "" : e.url);
        } finally {
            applyingMetaUiV031 = false;
        }
        clearDraftMetadataV031();
        if (diagnostics != null) diagnostics.log(episodeId, "ui_meta_bound_v031",
                "reason=" + reason + ";programChars=" + safeLengthV031(e.program)
                        + ";titleChars=" + safeLengthV031(e.title)
                        + ";urlChars=" + safeLengthV031(e.url));
        updateCurrentLabel();
    }

    private int safeLengthV031(String s) { return s == null ? 0 : s.length(); }

    private void saveDraftMetadataV031() {
        if (programInput == null || episodeInput == null || urlInput == null || applyingMetaUiV031) return;
        getSharedPreferences("episode_meta_draft_v031", MODE_PRIVATE).edit()
                .putString("program", programInput.getText().toString())
                .putString("title", episodeInput.getText().toString())
                .putString("url", urlInput.getText().toString())
                .putLong("savedAt", System.currentTimeMillis())
                .apply();
    }

    private void restoreDraftMetadataV031() {
        SharedPreferences p = getSharedPreferences("episode_meta_draft_v031", MODE_PRIVATE);
        long savedAt = p.getLong("savedAt", 0L);
        if (savedAt <= 0L || System.currentTimeMillis() - savedAt > 7L * 24L * 60L * 60L * 1000L) return;
        String program = p.getString("program", "");
        String title = p.getString("title", "");
        String url = p.getString("url", "");
        if (program.isEmpty() && title.isEmpty() && url.isEmpty()) return;
        applyingMetaUiV031 = true;
        try {
            programInput.setText(program);
            episodeInput.setText(title);
            urlInput.setText(url);
        } finally {
            applyingMetaUiV031 = false;
        }
        if (diagnostics != null) diagnostics.log(-1L, "ui_meta_draft_restored_v031",
                "programChars=" + program.length() + ";titleChars=" + title.length()
                        + ";urlChars=" + url.length());
        updateCurrentLabel();
    }

    private void clearDraftMetadataV031() {
        getSharedPreferences("episode_meta_draft_v031", MODE_PRIVATE).edit().clear().apply();
    }

'''
            m = m.replace(marker, methods + marker)
        }

        // When a service broadcast points at another/current restored episode, populate the fields
