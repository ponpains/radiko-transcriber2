            m = replaceOnce031(m, destroy, destroyNew, "destroy metadata callback")
        }

        mainFile.write(m, "UTF-8")

        // -----------------------------------------------------------------------------
        // 2) N-best completeness guard.
        // v0.30 selected "毎日 Yahoo JAPAN の" over the recognizer's primary candidate
        // "毎日 Yahoo JAPAN の使える Ai エージェント" for only +0.029 confidence. In free
        // talk, a candidate that is merely a much shorter prefix should not win on a tiny
        // confidence advantage and silently discard spoken content.
        // -----------------------------------------------------------------------------
        File candidateFile = file("src/main/java/com/example/radikotranscriber/KerekereCandidateDecisionEngine.java")
        String c = candidateFile.getText("UTF-8")
        c = c.replace("candidate-decision-v026-2026-09-06", "candidate-decision-v031-2026-09-09")

        if (!c.contains("primaryRetentionPenaltyV031")) {
            String stateMarker = '''        State state = detectState(previousText, candidates.get(0));
        out.state = state;
        double best = -1e18, second = -1e18;'''
            String stateNew = '''        State state = detectState(previousText, candidates.get(0));
        out.state = state;
        String primaryCandidateV031 = safe(candidates.get(0)).trim();
        float primaryConfidenceV031 = confidence != null && confidence.length > 0 ? confidence[0] : -1f;
        double best = -1e18, second = -1e18;'''
            c = replaceOnce031(c, stateMarker, stateNew, "candidate primary baseline")

            String scoreMarker = '''            double score = conf >= 0 ? conf * 8.0 : 0.0;
            score -= i * 0.07;'''
            String scoreNew = '''            double score = conf >= 0 ? conf * 8.0 : 0.0;
            score -= i * 0.07;
            score += primaryRetentionPenaltyV031(state, primaryCandidateV031, c,
                    primaryConfidenceV031, conf);'''
            c = replaceOnce031(c, scoreMarker, scoreNew, "candidate retention score")

            String helperMarker = '''    private static double languagePlausibility(String c, State state) {'''
            if (!c.contains(helperMarker)) throw new GradleException("v0.31: candidate helper marker missing")
            String helper = '''    private static double primaryRetentionPenaltyV031(State state, String primary,
                                                        String candidate,
                                                        float primaryConfidence,
                                                        float candidateConfidence) {
        if (state != State.FREE_TALK) return 0.0;
        String p = compactV031(primary), c = compactV031(candidate);
        if (p.length() < 10 || c.isEmpty() || c.length() >= p.length() || !p.startsWith(c)) return 0.0;
        double coverage = c.length() / (double)p.length();
        double gain = (primaryConfidence >= 0f && candidateConfidence >= 0f)
                ? candidateConfidence - primaryConfidence : 0.0;
        if (coverage < 0.68 && gain < 0.08) return -8.0;
        if (coverage < 0.82 && gain < 0.05) return -4.5;
        if (coverage < 0.93 && gain < 0.03) return -2.2;
        return 0.0;
    }

    private static String compactV031(String s) {
        return safe(s).replaceAll("[\\s、。！？!?，,.・･：:；;\\\"'’「」『』()（）]+", "");
    }

'''
            c = c.replace(helperMarker, helper + helperMarker)
        }
        candidateFile.write(c, "UTF-8")

        // -----------------------------------------------------------------------------
