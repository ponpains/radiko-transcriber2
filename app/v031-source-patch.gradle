        File profileFile = file("src/main/java/com/example/radikotranscriber/KerekereContextProfile.java")
        String k = profileFile.getText("UTF-8")
        if (!k.contains("radioCatCandidateV031")) {
            String profileScore = '''        double score = 0.0;

        boolean showContext = showTitleContext(context);'''
            String profileScoreNew = '''        double score = 0.0;

        boolean radioCatCandidateV031 = containsAny(c, "ラジオ ネコ", "ラジオ 猫", "ラジオねこ", "ラジオ猫");
        if (radioCatCandidateV031) score += 8.5;
        if (c.contains("ラジオネームの名前")) score -= 10.0;

