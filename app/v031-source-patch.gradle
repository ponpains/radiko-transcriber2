        if (!m.contains("episodeChangedV031")) {
            String receiver = '''            serviceRunning = running;
            if (episodeId > 0) activeEpisodeId = episodeId;
            if (s != null) status.setText(s);'''
            String receiverNew = '''            boolean wasRunningV031 = serviceRunning;
            serviceRunning = running;
            boolean episodeChangedV031 = episodeId > 0 && activeEpisodeId != episodeId;
            if (episodeId > 0) {
                activeEpisodeId = episodeId;
                if (episodeChangedV031 || (wasRunningV031 && !running)) {
                    bindMetadataFromStoreV031(episodeId,
                            episodeChangedV031 ? "broadcast_episode" : "broadcast_finish");
                }
            }
            if (s != null) status.setText(s);'''
            m = replaceOnce031(m, receiver, receiverNew, "receiver metadata bind")
        }

        if (!m.contains("bindMetadataFromStoreV031(id, \"runtime_resync\")")) {
            String runtime = '''        long id = p.getLong("episodeId", -1L);
        if (id > 0) activeEpisodeId = id;
        String rs = p.getString("status", "バックグラウンドで文字起こし中です。");'''
            String runtimeNew = '''        long id = p.getLong("episodeId", -1L);
        if (id > 0) {
            activeEpisodeId = id;
            bindMetadataFromStoreV031(id, "runtime_resync");
        }
        String rs = p.getString("status", "バックグラウンドで文字起こし中です。");'''
            m = replaceOnce031(m, runtime, runtimeNew, "runtime metadata bind")
        }

        // Once an episode row exists, the DB is authoritative and the temporary draft can go.
        if (!m.contains("clearDraftMetadataV031();\n            clearTranscriptForFreshEpisode();")) {
            String create = '''            activeEpisodeId = store.createEpisode(p, t, u);
            clearTranscriptForFreshEpisode();'''
            String createNew = '''            activeEpisodeId = store.createEpisode(p, t, u);
            clearDraftMetadataV031();
            clearTranscriptForFreshEpisode();'''
            m = replaceOnce031(m, create, createNew, "prepare episode draft clear")
        }

        if (!m.contains("activeEpisodeId = store.createEpisode(p, t, u);\n            clearDraftMetadataV031();\n        } else")) {
            String ensure = '''        if (activeEpisodeId <= 0) {
            activeEpisodeId = store.createEpisode(p, t, u);
        } else {'''
            String ensureNew = '''        if (activeEpisodeId <= 0) {
            activeEpisodeId = store.createEpisode(p, t, u);
            clearDraftMetadataV031();
        } else {'''
            m = replaceOnce031(m, ensure, ensureNew, "ensure episode draft clear")
        }

        // Metadata is safe to persist while transcription is running; only the transcript editor
        // itself must remain protected from overwriting the service-owned live text.
        if (!m.contains("saveMetadataV031(\"save_current\")")) {
            String save = '''    private void saveCurrentEdits() {
        if (store == null || activeEpisodeId <= 0 || serviceRunning) return;
        store.updateMeta(activeEpisodeId,
                programInput.getText().toString().trim(),
                episodeInput.getText().toString().trim(),
                urlInput.getText().toString().trim());
        store.updateEditedTranscript(activeEpisodeId, transcript.getText().toString());
    }
'''
            String saveNew = '''    private void saveCurrentEdits() {
        if (store == null) return;
        metaSaveHandlerV031.removeCallbacks(metaSaveRunnableV031);
        saveMetadataV031("save_current");
        if (activeEpisodeId > 0 && !serviceRunning) {
            store.updateEditedTranscript(activeEpisodeId, transcript.getText().toString());
        }
    }
'''
            m = replaceOnce031(m, save, saveNew, "save current edits")
        }

        if (!m.contains("metaSaveHandlerV031.removeCallbacks(metaSaveRunnableV031);\n        try { unregisterReceiver")) {
            String destroy = '''    @Override protected void onDestroy() {
        try { unregisterReceiver(receiver); } catch (Exception ignored) {}
        super.onDestroy();
    }'''
            String destroyNew = '''    @Override protected void onDestroy() {
        metaSaveHandlerV031.removeCallbacks(metaSaveRunnableV031);
        try { unregisterReceiver(receiver); } catch (Exception ignored) {}
        super.onDestroy();
