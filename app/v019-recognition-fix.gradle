// v0.19 incremental patch. Runs after the v0.18 source patch and compile fix.
// Priorities from the v0.18 diagnostic:
// 1) do not treat bytes written to a recognizer pipe as safely recognized;
// 2) freeze/replay audio across recognizer rotation and ignore expected stop callbacks;
// 3) merge cumulative segment/final results before commit;
// 4) format roughly one spoken sentence per line;
// 5) strengthen the kerekere-specific context profile.

def replaceRange = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.19 patch: start marker not found: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.19 patch: end marker not found: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

