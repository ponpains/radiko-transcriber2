    private void requestRecognizerRestart(String statusText, long delayMs) {
        requestRecognizerRestart(statusText, delayMs, false);
    }

    private void requestRecognizerRestart(String statusText, long delayMs, boolean planned) {
        if (!running || restartScheduled || drainComplete) return;
        restartScheduled = true;
        recognizerReady = false;
        plannedStopGeneration = recognizerGeneration;
        if (planned) {
            plannedRotationRequested = true;
            currentRotationId++;
            rotationReconnectCount = 0;
            requestReplayFromSafe("planned_rotation", REPLAY_RAW_MS);
        } else {
            requestReplayFromSafe("session_boundary", generationHadResult ? 900L : 2200L);
        }
        diag("recognizer_restart_scheduled", "activeGeneration=" + recognizerGeneration
                + ";planned=" + planned
                + ";plannedStopGeneration=" + plannedStopGeneration
                + ";delayMs=" + delayMs
                + ";feedOffset=" + feederReadOffset
                + ";safeOffset=" + safeCommittedOffset
                + ";replayOffset=" + requestedReplayOffset);
        broadcast(statusText, true);
        int generation = recognizerGeneration;
        mainHandler.postDelayed(() -> {
            if (!running || drainComplete) return;
            if (generation != recognizerGeneration) {
                restartScheduled = false;
                return;
            }
            startRecognizerSession(true);
        }, delayMs);
    }

    private boolean hasUsableRecognition(Bundle b) {
        if (b == null) return false;
        ArrayList<String> list = b.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
        if (list == null || list.isEmpty()) return false;
        for (String x : list) if (x != null && !x.trim().isEmpty()) return true;
        return false;
    }

    private void markRecognitionConfirmed(int generation, String source) {
        if (generation != recognizerGeneration) return;
        generationHadResult = true;
        long margin = rawBytesForMs(600L);
        long confirmed = Math.max(generationFeedStartOffset,
                Math.max(0L, generationFeedEndOffset - margin));
        if (confirmed > safeCommittedOffset) safeCommittedOffset = confirmed;
        diag("recognition_checkpoint", "source=" + source
                + ";activeGeneration=" + recognizerGeneration
                + ";feedStart=" + generationFeedStartOffset
                + ";feedEnd=" + generationFeedEndOffset
                + ";safeOffset=" + safeCommittedOffset);
    }

    private long rawBytesForMs(long ms) {
        long bytes = Math.round(Math.max(0L, ms) * SAMPLE_RATE * 2.0 / 1000.0);
        return bytes - (bytes & 1L);
    }

    private void requestReplayFromSafe(String reason, long overlapMs) {
        long base = Math.max(0L, safeCommittedOffset - rawBytesForMs(overlapMs));
        long current = requestedReplayOffset;
        if (current < 0L || base < current) requestedReplayOffset = base;
        diag("recognizer_replay_requested", "reason=" + reason
                + ";activeGeneration=" + recognizerGeneration
                + ";feedOffset=" + feederReadOffset
                + ";safeOffset=" + safeCommittedOffset
                + ";rollbackOffset=" + requestedReplayOffset
                + ";replayMs=" + overlapMs);
    }

