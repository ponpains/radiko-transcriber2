                            feedStart, feedEnd);
                    if (!sent) {
                        requestReplayFromSafe("feed_generation_changed", 3000L);
                        continue;
                    }

                    pos = feedEnd;
                    feederReadOffset = pos;
                    generationFeedEndOffset = Math.max(generationFeedEndOffset, pos);
                    spoolBytesConsumed = Math.max(spoolBytesConsumed, pos);
                    applyBreakMarkers(pos);

                    long now = System.currentTimeMillis();
                    if (now - lastStatus > 1500L) {
                        String status = bufferedStatusText();
                        broadcast(status, true);
                        updateNotification(status);
                        lastStatus = now;
                    }
                }
            } catch (Exception e) {
                diag("buffered_feeder_error", e.getClass().getSimpleName() + ":" + e.getMessage());
                if (running) mainHandler.post(() -> {
                    if (sourceFinished) stopEverything("音声の残り処理中にエラーが起きました。途中まで保存しました。",
                            "error", "buffered_feeder_error");
                });
            }
        }, "BufferedAudioFeeder");
        feederThread.start();
    }

    private boolean writeRecognizerBytesForGeneration(byte[] data, int generation,
                                                        long rawStart, long rawEnd) {
        if (data == null || data.length == 0) return true;
        int offset = 0;
        while (running && offset < data.length && !drainComplete) {
            if (!recognizerReady || generation != recognizerGeneration) {
                diag("feed_aborted", "feedGeneration=" + generation
                        + ";activeGeneration=" + recognizerGeneration
                        + ";rawStart=" + rawStart + ";rawEnd=" + rawEnd
                        + ";encodedSent=" + offset + "/" + data.length);
                return false;
            }
            OutputStream target;
            synchronized (pipeLock) { target = pipeOut; }
            if (target == null) {
                sleepQuietly(20L);
                continue;
            }
            int len = Math.min(4096, data.length - offset);
            try {
                target.write(data, offset, len);
                offset += len;
            } catch (IOException e) {
                diag("feeder_pipe_retry", "feedGeneration=" + generation
                        + ";activeGeneration=" + recognizerGeneration
                        + ";rawStart=" + rawStart + ";rawEnd=" + rawEnd
                        + ";encodedSent=" + offset
                        + ";error=" + e.getClass().getSimpleName());
                return false;
            }
        }
        if (offset >= data.length) {
            diag("recognizer_feed", "generation=" + generation
                    + ";startOffset=" + rawStart + ";endOffset=" + rawEnd
                    + ";safeOffset=" + safeCommittedOffset);
            return true;
        }
        return false;
    }

    private void rewindBreakMarkersTo(long offset) {
        synchronized (breakLock) {
            int i = 0;
            while (i < breakMarkers.size() && breakMarkers.get(i).rawByteOffset <= offset) i++;
            nextBreakMarker = i;
            pendingParagraphBreak = false;
            pendingSentenceBreak = false;
        }
    }

    private void resetHighSpeedProcessorForReplay() {
        if (!isHighSpeed()) return;
        try { if (highSpeedProcessor != null) highSpeedProcessor.reset(); } catch (Exception ignored) {}
        try {
            highSpeedProcessor = new HighSpeedSonicProcessor(playbackSpeed);
            diag("high_speed_processor_replay_reset", "factor=" + playbackSpeed
                    + ";feedOffset=" + feederReadOffset);
        } catch (Exception e) {
            highSpeedProcessor = null;
            diag("high_speed_processor_replay_error", e.getClass().getSimpleName() + ":" + e.getMessage());
        }
    }

