plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.radikotranscriber'
    compileSdk 35

    defaultConfig {
        applicationId "com.ponpains.radikotranscriber"
        minSdk 33
        targetSdk 35
        versionCode 30
        versionName "0.30"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        stableDebug {
            storeFile rootProject.file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
            storeType "JKS"
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.stableDebug }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.media3:media3-common:1.8.1'
}

apply from: 'v018-source-patch.gradle'
apply from: 'v018-compile-fix.gradle'
apply from: 'v019-recognition-fix.gradle'
apply from: 'v019-format-fine-tune.gradle'
apply from: 'v020-source-patch.gradle'
apply from: 'v020-compile-fix.gradle'
apply from: 'v021-source-patch.gradle'
apply from: 'v022-source-patch.gradle'
apply from: 'v023-source-patch.gradle'
apply from: 'v024-source-patch.gradle'
apply from: 'v024-latest-corrections.gradle'
apply from: 'v025-source-patch.gradle'
apply from: 'v026-source-patch-fixed.gradle'
apply from: 'v026-compile-fix.gradle'
apply from: 'v027-source-patch2.gradle'
apply from: 'v028-source-patch.gradle'
apply from: 'v029-source-patch.gradle'
// v030-source-patch references this only while rewriting RadikoApplication's diagnostic string.
ext.CorrectionSanitizer = [VERSION: 'correction-sanitizer-v030-2026-09-08']
apply from: 'v030-source-patch.gradle'
apply from: 'v030-followup.gradle'
