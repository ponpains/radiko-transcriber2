// v0.26: three precision layers requested after the v0.25 diagnostic.
// 1) unified candidate decision (show state + future official context),
// 2) selective re-recognition of only suspicious short PCM intervals after the main drain,
// 3) whole-transcript final proofreading + learned paragraph layout.
// The stable v0.21 checkpoint/replay transport itself is intentionally not changed.

def replaceRange026 = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.26 patch: start marker not found: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.26 patch: end marker not found: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

