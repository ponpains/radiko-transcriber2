// Compile-safe v0.27 integration. Applied after all v0.26 patches.
def replaceRange027b = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.27b: start marker missing: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.27b: end marker missing: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

