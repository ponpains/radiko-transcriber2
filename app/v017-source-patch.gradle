// v0.17 build-time source patch.
// This supersedes v016-source-patch.gradle and includes all v0.16 recognition changes plus the
// researched "≠ME 永田詩央里のけれけれ" language profile. Each CI checkout starts clean, so the
// whole engine delta is applied here exactly once before Android compilation.

def replaceRange = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.17 patch: start marker not found: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.17 patch: end marker not found: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

tasks.named("preBuild").configure {
    doFirst {
        File serviceFile = file("src/main/java/com/example/radikotranscriber/TranscribeService.java")
        String s = serviceFile.getText("UTF-8")

        if (!s.contains("private HighSpeedSonicProcessor highSpeedProcessor;")) {
            s = s.replace(
                    "    private DiagnosticStore diagnostics;\n",
                    "    private DiagnosticStore diagnostics;\n    private HighSpeedSonicProcessor highSpeedProcessor;\n")
        }

        // Keep the v0.16 recovery behavior: the diagnostic pack showed provider disconnects around
        // long recognizer sessions, while PCM capture itself remained complete in the spool.
        s = s.replace("            long rollover = 65000L;", "            long rollover = 58000L;")
        s = s.replace(
                "                requestRecognizerRestart(\"認識器を安全に更新しています…\", 850L);",
                "                requestRecognizerRestart(\"認識器を安全に更新しています…\", 2200L);")
        s = s.replace(
                "                        else if (error == SpeechRecognizer.ERROR_SERVER_DISCONNECTED\n                                || error == SpeechRecognizer.ERROR_SERVER) delay = 1000L;",
                "                        else if (error == SpeechRecognizer.ERROR_SERVER_DISCONNECTED\n                                || error == SpeechRecognizer.ERROR_SERVER) delay = 2000L;")

        if (!s.contains("engine=Media3Sonic")) {
            s = s.replace(
                    "        prepareSpool();\n        acquireWakeLock();",
                    "        prepareSpool();\n        highSpeedProcessor = isHighSpeed() ? new HighSpeedSonicProcessor(playbackSpeed) : null;\n        if (highSpeedProcessor != null) diag(\"high_speed_processor\", \"engine=Media3Sonic;factor=\" + playbackSpeed);\n        acquireWakeLock();")
        }

        // Record exactly which program profile controlled this run.
        if (!s.contains("programContext=")) {
            s = s.replace(
                    "                + \";autoStop=\" + autoStopEnabled + \";bufferedCapture=true\"\n                + \";format=\" + FormatLearningStore.describe(this, program));",
                    "                + \";autoStop=\" + autoStopEnabled + \";bufferedCapture=true\"\n                + \";format=\" + FormatLearningStore.describe(this, program)\n                + \";programContext=\" + KerekereContextProfile.describe(program));")
        }

        // Program-specific context participates directly in candidate selection. This is stronger
        // than the generic hint bonus, but it never forces an arbitrary missing phrase.
        if (!s.contains("KerekereContextProfile.scoreCandidate(program, c, finalText)")) {
            String scoreAnchor = '''            for (String hint : hints) {
                String h = hint == null ? "" : hint.trim();
                if (h.length() < 2 || h.length() > 30) continue;
                if (c.contains(h)) score += Math.min(4.5, 0.9 + h.length() * 0.24);
            }
            score += Math.min(c.length(), 140) * 0.002;
'''
            String scoreReplacement = '''            for (String hint : hints) {
                String h = hint == null ? "" : hint.trim();
                if (h.length() < 2 || h.length() > 30) continue;
                if (c.contains(h)) score += Math.min(4.5, 0.9 + h.length() * 0.24);
            }
            score += KerekereContextProfile.scoreCandidate(program, c, finalText);
            score += Math.min(c.length(), 140) * 0.002;
'''
            if (!s.contains(scoreAnchor)) throw new GradleException("v0.17 patch: candidate score anchor missing")
            s = s.replace(scoreAnchor, scoreReplacement)
        }

        // Apply only conservative, context-gated corrections after the sanitized lexical rules.
        if (!s.contains("ContextCorrectionEngine.refine(program, finalText, lexical)")) {
            s = s.replace(
                    "        String corrected = store.applyCorrections(program, selected.trim()).trim();",
                    "        String lexical = store.applyCorrections(program, selected.trim()).trim();\n" +
                    "        String corrected = ContextCorrectionEngine.refine(program, finalText, lexical).trim();\n" +
                    "        if (!corrected.equals(lexical)) {\n" +
                    "            diag(\"context_correction\", \"profile=\" + KerekereContextProfile.PROFILE_VERSION\n" +
                    "                    + \";from=\" + ContextCorrectionEngine.brief(lexical)\n" +
                    "                    + \";to=\" + ContextCorrectionEngine.brief(corrected));\n" +
                    "        }")
        }

        // Chunked writes reduce the amount that can be repeated if a recognizer pipe closes during
        // a restart. Media3 Sonic is stateful across all input chunks, unlike the old per-chunk OLA.
        String oldWriteBlock = '''                    boolean sent = false;
                    while (running && !sent && !drainComplete) {
                        OutputStream target;
                        synchronized (pipeLock) { target = pipeOut; }
                        if (target == null) {
                            sleepQuietly(35L);
                            continue;
                        }
                        try {
                            target.write(encoded);
                            sent = true;
                        } catch (IOException e) {
                            diag("feeder_pipe_retry", "generation=" + recognizerGeneration
                                    + ";pos=" + pos + ";error=" + e.getClass().getSimpleName());
                            sleepQuietly(100L);
                        }
                    }
                    if (!sent) continue;
'''
        String newWriteBlock = '''                    boolean sent = writeRecognizerBytes(encoded);
                    if (!sent) continue;
'''
        if (s.contains(oldWriteBlock)) s = s.replace(oldWriteBlock, newWriteBlock)

        s = s.replace(
                "                        if (sourceFinished) {\n                            markDrainComplete();\n                            break;\n                        }",
                "                        if (sourceFinished) {\n                            finishHighSpeedProcessorToPipe();\n                            markDrainComplete();\n                            break;\n                        }")
        s = s.replace(
                "        if (spoolBytesConsumed >= spoolBytesWritten) markDrainComplete();",
                "        if (spoolBytesConsumed >= spoolBytesWritten) {\n            finishHighSpeedProcessorToPipe();\n            markDrainComplete();\n        }")

        String replacementMethods = '''    private boolean writeRecognizerBytes(byte[] data) {
        if (data == null || data.length == 0) return true;
        int offset = 0;
        while (running && offset < data.length && !drainComplete) {
            OutputStream target;
            synchronized (pipeLock) { target = pipeOut; }
            if (target == null) {
                sleepQuietly(35L);
                continue;
            }
            int len = Math.min(4096, data.length - offset);
            try {
                target.write(data, offset, len);
                offset += len;
            } catch (IOException e) {
                diag("feeder_pipe_retry", "generation=" + recognizerGeneration
                        + ";offset=" + offset + ";error=" + e.getClass().getSimpleName());
                sleepQuietly(110L);
            }
        }
        return offset >= data.length;
    }

    private void finishHighSpeedProcessorToPipe() {
        HighSpeedSonicProcessor p = highSpeedProcessor;
        if (p == null) return;
        try {
            byte[] tail = p.finish();
            if (tail.length > 0) writeRecognizerBytes(tail);
            diag("high_speed_processor_finish", "tailBytes=" + tail.length);
        } catch (Exception e) {
            diag("high_speed_processor_finish_error", e.getClass().getSimpleName() + ":" + e.getMessage());
        } finally {
            try { p.reset(); } catch (Exception ignored) {}
            highSpeedProcessor = null;
        }
    }

    private byte[] encodeForRecognizer(short[] input, int n, float factor) {
        if (factor < 1.4f || highSpeedProcessor == null) return pcmBytes(input, n);
        try {
            return highSpeedProcessor.process(input, n);
        } catch (Exception e) {
            diag("high_speed_processor_error", e.getClass().getSimpleName() + ":" + e.getMessage());
            return pcmBytes(input, n);
        }
    }

'''
        s = replaceRange(s,
                "    private byte[] encodeForRecognizer(short[] input, int n, float factor) {",
                "    private void sleepQuietly(long ms) {",
                replacementMethods,
                "TranscribeService high-speed methods")

        if (!s.contains("highSpeedProcessor = null;\n        store.autoBackup")) {
            s = s.replace(
                    "        store.autoBackup(this);",
                    "        if (highSpeedProcessor != null) {\n" +
                    "            try { highSpeedProcessor.reset(); } catch (Exception ignored) {}\n" +
                    "            highSpeedProcessor = null;\n" +
                    "        }\n" +
                    "        store.autoBackup(this);")
        }
        serviceFile.write(s, "UTF-8")

        File episodeFile = file("src/main/java/com/example/radikotranscriber/EpisodeStore.java")
        String e = episodeFile.getText("UTF-8")

        String safeApply = '''    public String applyCorrections(String program, String text) {
        return CorrectionSanitizer.applySinglePass(getCorrections(program), text);
    }

'''
        e = replaceRange(e,
                "    public String applyCorrections(String program, String text) {",
                "    public ArrayList<String> getBiasStrings(String program, String title) {",
                safeApply,
                "EpisodeStore single-pass corrections")

        String biasMethod = '''    public ArrayList<String> getBiasStrings(String program, String title) {
        LinkedHashSet<String> set = new LinkedHashSet<>();

        // Program knowledge has first priority. These are recognition hints, not blind replacements.
        for (String term : KerekereContextProfile.biasTerms(program)) {
            if (set.size() >= 50) break;
            set.add(term);
        }
        if (set.size() < 50) addUsefulBias(set, safe(program));
        if (set.size() < 50) addUsefulBias(set, safe(title));
        for (Correction r : getCorrections(program)) {
            String corrected = normalizeLexical(r.correct);
            if (corrected.length() >= 2) set.add(corrected);
            if (set.size() >= 50) break;
        }
        ArrayList<String> out = new ArrayList<>(set);
        return out.size() <= 50 ? out : new ArrayList<>(out.subList(0, 50));
    }

'''
        e = replaceRange(e,
                "    public ArrayList<String> getBiasStrings(String program, String title) {",
                "    private void addUsefulBias(LinkedHashSet<String> set, String s) {",
                biasMethod,
                "EpisodeStore program-first bias strings")

        e = e.replace(
                "            if (wrong.length() < 2 || wrong.length() > 40 || correct.isEmpty() || correct.length() > 40) continue;",
                "            if (!CorrectionSanitizer.isSafeLearnedPair(e.program, wrong, correct)) continue;")
        episodeFile.write(e, "UTF-8")

        File layout = file("src/main/res/layout/activity_main.xml")
        String x = layout.getText("UTF-8")
        x = x.replace("v0.15", "v0.17").replace("v0.16", "v0.17")
        x = x.replace("実験：radiko＋文字起こし画面を開く", "実験：アプリ内で文字起こし開始")
        x = x.replace(
                "1.5x / 2.0xは音声取得と認識を分離します。再生を取りこぼさず一時バッファへ保存し、認識後に自動削除します。",
                "1.5x / 2.0xは音声を一時保存し、Media3 Sonicで通常速度に近づけてから認識します。再生終了後も残りを処理します。")
        x = x.replace(
                "v0.17  •  改行学習 / 診断ログ / 再生位置 / アプリ内Web＋文字起こし",
                "v0.17  •  けれけれ専用文脈 / 改行学習 / 診断ログ / バッファ認識")
        layout.write(x, "UTF-8")
    }
}
