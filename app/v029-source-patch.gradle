tasks.named("preBuild").configure {
    doLast {
        File rrFile = file("src/main/java/com/example/radikotranscriber/SelectiveRerecognitionEngineV026.java")
        String r = rrFile.getText("UTF-8")

        r = r.replace("selective-rerecognition-v027-2026-09-06", "selective-rerecognition-v029-2026-09-08")

        if (!r.contains("READY_SETTLE_MS")) {
            String marker = '''    private static final double FEED_RATE = 1.05;
'''
            if (!r.contains(marker)) throw new GradleException("v0.29: rerecognition constants marker missing")
            r = r.replace(marker, '''    private static final double FEED_RATE = 1.05;
    private static final long READY_SETTLE_MS = 180L;
    private static final long END_SILENCE_MS = 900L;
    private static final long EMPTY_RESULT_GRACE_MS = 900L;
''')
        }

        if (!r.contains("deferredSegmentResults")) {
            String marker = '''        Runnable timeout;
        boolean finishedCurrent;
'''
            if (!r.contains(marker)) throw new GradleException("v0.29: rerecognition state marker missing")
            r = r.replace(marker, '''        Runnable timeout;
        Runnable emptyResultGrace;
        boolean finishedCurrent;
        boolean readyCurrent;
        boolean feedStarted;
        Bundle deferredSegmentResults;
''')
        }

        if (!r.contains("readyCurrent = false;")) {
            String marker = '''            attempted++;
            finishedCurrent = false;
            try {'''
            if (!r.contains(marker)) throw new GradleException("v0.29: rerecognition reset marker missing")
            r = r.replace(marker, '''            attempted++;
            finishedCurrent = false;
            readyCurrent = false;
            feedStarted = false;
            deferredSegmentResults = null;
            try {''')
        }

        if (!r.contains("EXTRA_SEGMENTED_SESSION")) {
            String marker = '''                ri.putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE, readFd);
'''
            if (!r.contains(marker)) throw new GradleException("v0.29: audio source marker missing")
            r = r.replace(marker, '''                ri.putExtra(RecognizerIntent.EXTRA_AUDIO_SOURCE, readFd);
                // With an external ParcelFileDescriptor, segmented-session mode makes EOF the
