// v0.18 build-time source patch.
// Includes v0.17 recognition/context changes and adds:
// - external-browser-only playback flow
// - automatic radiko episode metadata extraction
// - utterance-oriented line breaks

def replaceRange = { String text, String startMarker, String endMarker, String replacement, String label ->
    int a = text.indexOf(startMarker)
    if (a < 0) throw new GradleException("v0.18 patch: start marker not found: " + label)
    int b = text.indexOf(endMarker, a)
    if (b < 0) throw new GradleException("v0.18 patch: end marker not found: " + label)
    return text.substring(0, a) + replacement + text.substring(b)
}

