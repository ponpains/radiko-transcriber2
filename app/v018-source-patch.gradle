        String readableMethod = '''    private void appendReadable(String text, boolean topicBreak,
                                boolean sentenceFromSilence, boolean utteranceBoundary) {
        text = formatRecognizedSegment(text);
        if (text.isEmpty()) return;

        // A clear acoustic pause can close the previous utterance even when Google's text omitted
        // punctuation. Do not do this at artificial recognizer rollovers.
        if (sentenceFromSilence && !finalText.isEmpty()
                && !endsWithSentencePunctuation(finalText)
                && !finalText.endsWith("\\n")) {
            finalText += "。";
        }

        String[] pieces = text.split("(?<=[。！？!?])");
        boolean firstPiece = true;
        int charLimit = formatProfile == null ? 260 : Math.max(220, formatProfile.paragraphChars);
        int lineLimit = formatProfile == null ? 7 : Math.max(6, formatProfile.linesPerParagraph);
        for (String piece : pieces) {
            piece = piece.trim();
            if (piece.isEmpty()) continue;

            // A finalized/segmented ASR block is a spoken-unit boundary. Add terminal punctuation
            // only for a substantial completed-looking unit; short fillers stay natural.
            if (utteranceBoundary && !endsWithSentencePunctuation(piece)
                    && piece.length() >= 9 && !looksLikeOpenEndedFragment(piece)) {
                piece += "。";
            }

            boolean newParagraph = !finalText.isEmpty()
                    && ((firstPiece && topicBreak)
                    || currentParagraphLength() >= charLimit
                    || currentParagraphSentenceCount() >= lineLimit);

            if (!finalText.isEmpty()) {
                if (newParagraph) {
                    if (!finalText.endsWith("\\n\\n")) {
                        if (finalText.endsWith("\\n")) finalText += "\\n";
                        else finalText += "\\n\\n";
                    }
                } else if (!firstPiece || utteranceBoundary || sentenceFromSilence) {
                    if (!finalText.endsWith("\\n")) finalText += "\\n";
                } else if (!finalText.endsWith(" ") && !finalText.endsWith("\\n")) {
                    // Watchdog/session recovery is not a speech boundary. Reconnect the text with a
                    // space instead of manufacturing a newline in the middle of one utterance.
                    finalText += " ";
                }
            }
            finalText += piece;
            firstPiece = false;
        }
    }

    private boolean looksLikeOpenEndedFragment(String s) {
        String x = s == null ? "" : s.trim();
        String[] endings = {"けど", "けれど", "けれども", "ので", "から", "て", "で", "し",
                "とか", "って", "という", "あの", "その", "この", "なんか", "えっと", "まあ"};
        for (String e : endings) if (x.endsWith(e)) return true;
        return false;
    }

