        String metadataMethods = '''    private void setupUrlMetadata() {
        urlInput.addTextChangedListener(new TextWatcher() {
            @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
            @Override public void onTextChanged(CharSequence s, int start, int before, int count) {}
            @Override public void afterTextChanged(Editable editable) {
                if (serviceRunning) return;
                final String u = editable == null ? "" : editable.toString().trim();
                final int serial = ++metadataRequestSerial;
                if (!RadikoMetadataFetcher.looksLikeRadikoEpisode(u)) return;
                // Debounce paste/typing. The serial check makes older queued lookups harmless.
                new Handler(Looper.getMainLooper()).postDelayed(() -> {
                    if (serial != metadataRequestSerial) return;
                    if (!u.equals(urlInput.getText().toString().trim())) return;
                    fetchRadikoMetadata(false);
                }, 650L);
            }
        });
    }

    private void fetchRadikoMetadata(boolean manual) {
        final String u = urlInput.getText().toString().trim();
        if (!RadikoMetadataFetcher.looksLikeRadikoEpisode(u)) {
            if (manual) status.setText("radiko PodcastのURLを入力してください。");
            return;
        }
        final int serial = ++metadataRequestSerial;
        final String beforeEpisode = episodeInput.getText().toString().trim();
        if (manual || beforeEpisode.isEmpty()) status.setText("radikoから放送回・タイトル・放送日を取得しています…");

        RadikoMetadataFetcher.fetchAsync(u, result -> {
            if (serial != metadataRequestSerial) return;
            if (!u.equals(urlInput.getText().toString().trim())) return;

            if (!result.program.isEmpty() && programInput.getText().toString().trim().isEmpty()) {
                programInput.setText(result.program);
            }

            String display = result.displayEpisode();
            String current = episodeInput.getText().toString().trim();
            boolean safeToFill = current.equals(beforeEpisode)
                    && (beforeEpisode.isEmpty() || "名称未入力の回".equals(beforeEpisode)
                    || beforeEpisode.equals(lastAutoEpisodeText));
            if (!display.isEmpty() && safeToFill) {
                episodeInput.setText(display);
                lastAutoEpisodeText = display;
            }

            if (result.hasEpisodeIdentity()) {
                StringBuilder b = new StringBuilder("自動取得：");
                if (!result.episodeNumber.isEmpty()) b.append(result.episodeNumber);
                if (!result.episodeTitle.isEmpty()) b.append("「").append(result.episodeTitle).append("」");
                if (!result.broadcastDate.isEmpty()) b.append("  ").append(result.broadcastDate).append("放送分");
                status.setText(b.toString());
                diagnostics.log(activeEpisodeId, "radiko_metadata",
                        "number=" + result.episodeNumber + ";title=" + result.episodeTitle
                                + ";date=" + result.broadcastDate + ";program=" + result.program);

                // A very fast Start tap can create the episode before the network lookup returns.
                // If it is still the same URL and the current title is auto-fillable, update storage.
                if (activeEpisodeId > 0) {
                    EpisodeStore.Episode ep = store.getEpisode(activeEpisodeId);
                    if (ep != null && sameEpisodeUrl(ep.url, u)
                            && !episodeInput.getText().toString().trim().isEmpty()) {
                        store.updateMeta(activeEpisodeId,
                                programInput.getText().toString().trim(),
                                episodeInput.getText().toString().trim(), u);
                    }
                }
                updateCurrentLabel();
            } else if (manual) {
                status.setText("自動取得できませんでした。URLはそのまま使えるので、回名だけ手入力できます。");
                diagnostics.log(activeEpisodeId, "radiko_metadata_failed", "reason=" + result.error);
            }
        });
    }

