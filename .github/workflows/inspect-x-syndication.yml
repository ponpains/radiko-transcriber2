name: Inspect X syndication
on:
  workflow_dispatch:
  push:
    branches: ["shiori-archive-mvp"]
    paths: ['.github/workflows/inspect-x-syndication.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect official public profile syndication
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,re,json,html
          u='https://syndication.twitter.com/srv/timeline-profile/screen-name/nagata_shiori_?dnt=true'
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0'})
          data=urllib.request.urlopen(req,timeout=20).read().decode('utf-8','replace')
          m=re.search(r'<script id="__NEXT_DATA__" type="application/json">(.*?)</script>',data,re.S)
          obj=json.loads(html.unescape(m.group(1)))
          tl=obj['props']['pageProps']['timeline']
          print('TIMELINE_KEYS',list(tl.keys()))
          entries=tl.get('entries',[])
          print('ENTRY_COUNT',len(entries))
          print('ENTRY_IDS',[e.get('entry_id') for e in entries])
          for e in entries[:3]:
            print('ENTRY_KEYS',e.keys())
            print(json.dumps(e,ensure_ascii=False)[:5000])
          print('CURSORS',[(k,v) for k,v in tl.items() if 'cursor' in k.lower()])
          PY
