name: Inspect Talk X backfill v0.9.3
on:
  workflow_dispatch:
  push:
    branches: ["shiori-archive-mvp"]
    paths: ['.github/workflows/inspect-talk-x-v093.yml','shiori-archive/scripts/backfill_x_talk_v093.py']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore v0.9.2 seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10051091513/zip" -o v092.zip
          unzip -q v092.zip -d v092
          APK=$(find v092 -type f -name 'shiori-archive-v0.9.2.apk' | head -1)
          mkdir -p shiori-archive/app/src/main/assets
          unzip -p "$APK" assets/archive_seed.json > shiori-archive/app/src/main/assets/archive_seed.json
      - name: Run Talk backfill
        run: |
          python3 shiori-archive/scripts/backfill_x_talk_v093.py
          cat shiori-archive/app/src/main/assets/archive_v093_report.json
      - uses: actions/upload-artifact@v4
        with:
          name: talk-x-v093-report
          path: shiori-archive/app/src/main/assets/archive_v093_report.json
