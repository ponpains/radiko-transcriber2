name: Inspect public X archive structure

on:
  push:
    branches: [ "shiori-archive-mvp" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect archive pagination and current mirror load-more
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          base='https://twfan.net/user/1098230959269281792'
          for mode in ['old','new','favorite','media']:
            counts=[]
            unique=set()
            for page in range(1,31):
              url=f'{base}/{mode}/{page}'
              try:
                req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ShioriArchive/0.7'})
                raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8',errors='replace')
              except Exception as e:
                print(mode,page,'ERROR',repr(e)); break
              hrefs=re.findall(r'href="([^"]+)"[^>]*>\s*このツイートへ',raw,re.S)
              ids=[]
              for h in hrefs:
                m=re.search(r'(?:twitter|x)\.com/nagata_shiori_/status/(\d+)',html.unescape(h),re.I)
                if m: ids.append(m.group(1)); unique.add(m.group(1))
              if not ids:
                print(mode,'stopped at page',page,'unique',len(unique)); break
              counts.append(len(ids))
            print(mode,'pages',len(counts),'unique',len(unique),'counts_tail',counts[-3:])

          for host in ['https://www.twstalker.com/nagata_shiori_','https://mobile.twstalker.com/nagata_shiori_','https://www.sotwe.com/nagata_shiori_']:
            try:
              req=urllib.request.Request(host,headers={'User-Agent':'Mozilla/5.0 ShioriArchive/0.7'})
              raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8',errors='replace')
            except Exception as e:
              print('mirror ERROR',host,repr(e)); continue
            print('\nMIRROR',host,'bytes',len(raw))
            for pat in [r'href="([^"]*(?:load|more|cursor|page)[^"]*)"',r'(?:cursor|next_cursor|page)["\'=:\s]+([^"\'&<> ]+)',r'loadMore[^\n]{0,220}',r'Load More.{0,220}']:
              vals=re.findall(pat,raw,re.I|re.S)
              print('PAT',pat[:30],'count',len(vals),'samples',[str(x)[:180] for x in vals[:8]])
          PY
