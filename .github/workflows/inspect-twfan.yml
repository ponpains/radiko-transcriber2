name: Inspect public X datasets

on:
  push:
    branches: [ "shiori-archive-mvp" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub CSV and Wayback snapshot text
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, io, json, re, urllib.request, html as htmllib, time
          from datetime import datetime, timezone, timedelta

          UA={'User-Agent':'ShioriArchive-research/0.7 (+public archive validation)'}
          def get(url, timeout=45):
              return urllib.request.urlopen(urllib.request.Request(url,headers=UA),timeout=timeout).read().decode('utf-8','replace')

          # Public GitHub CSV dataset
          raw=get('https://raw.githubusercontent.com/ydevx/udeep/main/sns/dat5/nagata_shiori_.csv')
          rows=list(csv.DictReader(io.StringIO(raw)))
          print('GITHUB_CSV bytes',len(raw),'rows',len(rows))
          dates=[r.get('created_at','') for r in rows if r.get('created_at')]
          print('GITHUB_CSV range',min(dates) if dates else None,max(dates) if dates else None)
          print('GITHUB_CSV unique ids',len({r.get('id') for r in rows if r.get('id')}))

          # Wayback CDX - find IDs outside twfan era and inspect snapshots.
          cdx=get('https://web.archive.org/cdx/search/cdx?url=twitter.com/nagata_shiori_/status/*&output=json&filter=statuscode:200&collapse=urlkey&fl=timestamp,original&limit=5000',60)
          rows_cdx=json.loads(cdx)
          byid={}
          for ts,orig in rows_cdx[1:]:
              m=re.search(r'/status/(\d{15,22})',orig)
              if m: byid.setdefault(m.group(1),(ts,orig))
          ids=sorted(byid,key=int)
          print('WAYBACK ids',len(ids))
          # sample late IDs likely beyond 2023-07 plus a few old IDs
          sample=ids[-8:]+ids[:2]
          for sid in sample:
              ts,orig=byid[sid]
              snap=f'https://web.archive.org/web/{ts}id_/{orig}'
              try:
                  page=get(snap,30)
                  candidates=[]
                  for pat in [
                      r'<meta[^>]+(?:property|name)=["\'](?:og:description|description)["\'][^>]+content=["\']([^"\']+)',
                      r'<meta[^>]+content=["\']([^"\']+)["\'][^>]+(?:property|name)=["\'](?:og:description|description)["\']',
                      r'"text"\s*:\s*"((?:\\.|[^"\\]){10,500})"',
                      r'data-testid=["\']tweetText["\'][^>]*>(.*?)</div>'
                  ]:
                      ms=re.findall(pat,page,re.I|re.S)
                      if ms: candidates.extend(ms[:3])
                  cleaned=[]
                  for x in candidates:
                      x=re.sub(r'<br\s*/?>','\n',x,flags=re.I)
                      x=re.sub(r'<[^>]+>','',x)
                      x=htmllib.unescape(x)
                      x=x.replace('\\n',' ').replace('\\"','"')
                      x=re.sub(r'\s+',' ',x).strip()
                      if x and x not in cleaned: cleaned.append(x)
                  print('SNAP',sid,ts,'bytes',len(page),'candidates',len(cleaned),'sample',cleaned[:2])
              except Exception as e:
                  print('SNAP_ERR',sid,ts,repr(e))
              time.sleep(0.5)
          PY
