name: Inspect archive post markup

on:
  push:
    branches: [ "shiori-archive-mvp" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect raw post markup and robots
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, re
          headers={'User-Agent':'Mozilla/5.0 ShioriArchive/0.7'}
          for robots in ['https://akbp48.com/robots.txt','https://twfan.net/robots.txt']:
              try:
                  r=urllib.request.urlopen(urllib.request.Request(robots,headers=headers),timeout=15).read().decode('utf-8','replace')
                  print('\nROBOTS',robots,'\n',r[:4000])
              except Exception as e: print('ROBOTS ERR',robots,repr(e))
          samples=[
            ('ark','https://akbp48.com/yoani34/member/%E6%B0%B8%E7%94%B0%E8%A9%A9%E5%A4%AE%E9%87%8C/tweet','1657569391175962625'),
            ('twfan','https://twfan.net/user/1098230959269281792/old/1','1099638521118175232')]
          for name,url,sid in samples:
              raw=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20).read().decode('utf-8','replace')
              k=raw.find(sid)
              print('\n===',name,'sid',sid,'index',k,'===')
              print(raw[max(0,k-1800):k+1800])
          PY
