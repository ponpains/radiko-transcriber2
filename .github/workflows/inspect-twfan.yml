name: Inspect ArKaiBu archive structure

on:
  push:
    branches: [ "shiori-archive-mvp" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect ArKaiBu pagination/API
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, html
          from urllib.parse import unquote
          url='https://akbp48.com/yoani34/member/%E6%B0%B8%E7%94%B0%E8%A9%A9%E5%A4%AE%E9%87%8C/tweet'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ShioriArchive/0.7'})
          raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8',errors='replace')
          print('bytes',len(raw))
          status=re.findall(r'https?://(?:twitter|x)\.com/nagata_shiori_/status/(\d+)',raw,re.I)
          print('status ids',len(status),'unique',len(set(status)),'firstlast',status[:2],status[-2:])
          links=re.findall(r'href=["\']([^"\']+)["\']',raw,re.I)
          cand=[]
          for x in links:
            y=html.unescape(x)
            if any(k in y.lower() for k in ['tweet','page','calendar','2023','2022','cursor','more']): cand.append(y)
          print('candidate links',len(cand))
          for x in cand[-80:]: print('LINK',unquote(x)[:300])
          for pat in [r'<script[^>]*src=["\']([^"\']+)',r'<form[^>]+action=["\']([^"\']+)',r'(?:ajax|api|fetch|axios)[^\n]{0,300}',r'(?:page|offset|limit|cursor)[^\n]{0,180}']:
            vals=re.findall(pat,raw,re.I)
            print('PAT',pat[:35],len(vals))
            for v in vals[:30]: print(' ',str(v)[:400])
          PY
