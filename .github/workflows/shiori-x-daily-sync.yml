name: Daily Shiori X archive sync (free public timeline)
on:
  schedule:
    - cron: "35 21 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shiori-x-daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: shiori-archive-mvp
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Install free read-only X client
        run: go install github.com/tamnd/x-cli/cmd/x@latest
      - name: Import new public posts
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          x timeline nagata_shiori_ -o jsonl -n 100 > /tmp/shiori-x.jsonl
          test -s /tmp/shiori-x.jsonl
          python3 shiori-archive/scripts/import_x_daily.py
      - name: Commit archive changes
        run: |
          if git diff --quiet; then
            echo "No archive changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shiori-archive/data
          git commit -m "Daily sync: Shiori X archive"
          git push origin HEAD:shiori-archive-mvp
