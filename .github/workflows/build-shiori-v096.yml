name: Build Shiori Archive v0.9.6 repair expand and media filters
on:
  workflow_dispatch:
  push:
    branches: ["shiori-archive-mvp"]
    paths:
      - '.github/workflows/build-shiori-v096.yml'
      - 'shiori-archive/scripts/repair_expand_v096.py'
      - 'shiori-archive/scripts/repair_expand_v096_fast.py'
      - 'shiori-archive/scripts/patch_ui_v096.py'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore v0.9.5 seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10087679591/zip" -o v095.zip
          unzip -q v095.zip -d v095
          APK=$(find v095 -type f -name 'shiori-archive-v0.9.5.apk' | head -1)
          test -s "$APK"
          mkdir -p shiori-archive/app/src/main/assets
          unzip -p "$APK" assets/archive_seed.json > shiori-archive/app/src/main/assets/archive_seed.json
      - name: Repair duplicates and expand public archive
        run: python3 shiori-archive/scripts/repair_expand_v096_fast.py
      - name: Add one-tap media filters
        run: python3 shiori-archive/scripts/patch_ui_v096.py
      - name: Set version and freeze snapshot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('shiori-archive/app/build.gradle')
          s=p.read_text()
          s=re.sub(r'versionCode\s+\d+','versionCode 19',s)
          s=re.sub(r'versionName\s+"[^"]+"','versionName "0.9.6"',s)
          p.write_text(s)
          r=Path('shiori-archive/app/src/main/java/com/ponpains/shioriarchive/ArchiveRepository.java')
          t=r.read_text()
          t=t.replace('shiori-archive/data/','shiori-archive/stop/')
          t=re.sub(r'ShioriArchive/0\.[0-9.]+','ShioriArchive/0.9.6',t)
          r.write_text(t)
          PY
      - name: Verify repaired corpus
        run: |
          python3 - <<'PY'
          import json,re,collections
          p='shiori-archive/app/src/main/assets/archive_seed.json'
          d=json.load(open(p,encoding='utf-8'))
          ev=d['events'];x=[e for e in ev if e.get('type')=='X'];ids=[]
          for e in x:
              m=re.search(r'https://x\.com/nagata_shiori_/status/(\d+)$',e.get('sourceUrl','') or '')
              if m:ids.append(m.group(1))
              elif not (e.get('excerpt') or '').strip():raise SystemExit('content-only X without text')
          if len(ids)!=len(set(ids)):raise SystemExit('duplicate direct status ID')
          print('TOTAL',len(ev),'X',len(x),'DIRECT',len(ids),'CONTENT_ONLY',len(x)-len(ids),'X_TEXT',sum(bool((e.get('excerpt') or '').strip()) for e in x))
          print('TYPES',dict(collections.Counter(e.get('type','') for e in ev)))
          print(open('shiori-archive/app/src/main/assets/archive_v096_report.json',encoding='utf-8').read())
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore signing key
        run: |
          python3 - <<'PY'
          import base64,pathlib
          text=pathlib.Path('.github/workflows/build-apk.yml').read_text()
          line=next(x.strip() for x in text.splitlines() if x.strip().startswith("echo '") and 'base64 --decode > debug.keystore' in x)
          payload=line.split("echo '",1)[1].split("' | base64",1)[0]
          pathlib.Path('shiori-archive/debug.keystore').write_bytes(base64.b64decode(payload))
          PY
          test "$(sha256sum shiori-archive/debug.keystore | awk '{print $1}')" = "61cf96e814e00aa9238125a6b533cedfd476c8790e401c77167dc9e4d8d06664"
      - name: Build APK
        run: gradle -p shiori-archive :app:assembleDebug
      - name: Verify APK
        run: |
          APK=shiori-archive/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -5
          cp "$APK" shiori-archive-v0.9.6.apk
          sha256sum shiori-archive-v0.9.6.apk > shiori-archive-v0.9.6.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: shiori-archive-v0.9.6
          path: |
            shiori-archive-v0.9.6.apk
            shiori-archive/app/src/main/assets/archive_v096_report.json
            shiori-archive-v0.9.6.sha256
