name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable debug signing key
        shell: bash
        run: |
          echo '' | base64 --decode > debug.keystore
          test "$(sha256sum debug.keystore | awk '{print $1}')" = "61cf96e814e00aa9238125a6b533cedfd476c8790e401c77167dc9e4d8d06664"
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK signing and package
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: radiko-transcriber-v07-apk
          path: app/build/outputs/apk/debug/app-debug.apk
