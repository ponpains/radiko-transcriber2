name: Debug Sotwe markup

on:
  push:
    branches: [ "shiori-archive-mvp" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current public timeline markup
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, html as htmllib
          url='https://www.sotwe.com/nagata_shiori_'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ShioriArchive-debug'})
          raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8',errors='replace')
          pat=re.compile(r'<span>@nagata_shiori_</span>.*?<time datetime="([^"]+)"[^>]*>.*?</time>.*?<div class="v-card__text body-1 text--primary tweet-text px-0">\s*<div class="px-4 dynamic-link-content">(.*?)</div>',re.S)
          out=[]
          for m in pat.finditer(raw):
              body=re.sub(r'<br\s*/?>','\n',m.group(2),flags=re.I)
              body=htmllib.unescape(re.sub(r'<[^>]+>','',body)).strip()
              if body: out.append((m.group(1),body.replace('\n',' / ')[:140]))
          print('matches',len(out))
          for x in out[:30]: print(x)
          PY
