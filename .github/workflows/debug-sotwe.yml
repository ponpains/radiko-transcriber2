name: Debug Sotwe markup

on:
  push:
    branches: [ "shiori-archive-mvp" ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current public timeline markup
        shell: bash
        run: |
          python3 - <<'PY'
          import re, urllib.request, html as htmllib
          from datetime import datetime, timezone, timedelta

          def clean(block):
              block=re.sub(r'<br\s*/?>','\n',block,flags=re.I)
              block=re.sub(r'<[^>]+>','',block)
              return htmllib.unescape(block).strip()

          for page in range(1,7):
              url='https://www.sotwe.com/nagata_shiori_' if page==1 else f'https://www.sotwe.com/nagata_shiori_?page={page}'
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 ShioriArchive-debug'})
                  raw=urllib.request.urlopen(req,timeout=20).read().decode('utf-8',errors='replace')
              except Exception as e:
                  print('PAGE',page,'ERROR',repr(e)); break
              chunks=re.split(r'<div class="v-card\b',raw)
              posts=[]
              for ch in chunks:
                  if '<span>@nagata_shiori_</span>' not in ch:
                      continue
                  tm=re.search(r'<time datetime="([^"]+)"',ch)
                  body=re.search(r'<div class="px-4 dynamic-link-content">(.*?)</div>',ch,re.S)
                  if not tm or not body:
                      continue
                  text=clean(body.group(1))
                  if not text:
                      continue
                  posts.append((tm.group(1),text.replace('\n',' / ')[:90]))
              print('PAGE',page,'bytes',len(raw),'posts',len(posts),'first',posts[0] if posts else None,'last',posts[-1] if posts else None)
          PY
