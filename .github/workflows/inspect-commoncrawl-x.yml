name: Inspect Common Crawl X coverage
on:
  workflow_dispatch:
  push:
    branches: ["shiori-archive-mvp"]
    paths: ['.github/workflows/inspect-commoncrawl-x.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Query quarterly Common Crawl indexes
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.parse,urllib.error
          UA='ShioriArchive-CommonCrawl/0.1 (public URL metadata research; contact via github.com/ponpains/radiko-transcriber2)'
          with urllib.request.urlopen(urllib.request.Request('https://index.commoncrawl.org/collinfo.json',headers={'User-Agent':UA}),timeout=30) as r:
            cols=json.loads(r.read().decode())
          cols=[c for c in cols if re.match(r'CC-MAIN-20(19|20|21|22|23|24|25|26)-',c['id'])]
          cols=sorted(cols,key=lambda c:c['id'])
          # Roughly quarterly sample: every 3rd crawl per year.
          chosen=[]
          byyear={}
          for c in cols:byyear.setdefault(c['id'][8:12],[]).append(c)
          for y,arr in sorted(byyear.items()):chosen.extend(arr[::3])
          ids=set();per={}
          def query(endpoint,pat):
            q=urllib.parse.urlencode({'url':pat,'output':'json','filter':'status:200'})
            u=endpoint+'?'+q
            for n in range(4):
              try:
                with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA}),timeout=45) as r:return r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                if e.code in (429,503):time.sleep(15*(n+1));continue
                return ''
              except Exception:
                time.sleep(8*(n+1))
            return ''
          for i,c in enumerate(chosen):
            cid=c['id'];endpoint=c['cdx-api'];before=len(ids)
            pats=['*.twitter.com/nagata_shiori_/*']
            if int(cid[8:12])>=2023:pats.append('*.x.com/nagata_shiori_/*')
            for pat in pats:
              text=query(endpoint,pat)
              for line in text.splitlines():
                try:u=json.loads(line).get('url','')
                except:continue
                m=re.search(r'(?:x|twitter)\.com/nagata_shiori_/(?:status|statuses)/(\d{15,22})',u,re.I)
                if m:ids.add(m.group(1))
              time.sleep(1.8)
            per[cid]=len(ids)-before
            print('INDEX',cid,'NEW_UNION',per[cid],'TOTAL',len(ids))
          print('COMMONCRAWL_SAMPLE_INDEXES',len(chosen))
          print('COMMONCRAWL_UNIQUE_STATUS_IDS',len(ids))
          print('PER_INDEX',json.dumps(per,sort_keys=True))
          PY
