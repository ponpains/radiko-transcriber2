name: Inspect Common Crawl X coverage
on:
  workflow_dispatch:
  push:
    branches: ["shiori-archive-mvp"]
    paths: ['.github/workflows/inspect-commoncrawl-x.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Query all 2019-2026 Common Crawl indexes
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,time,urllib.request,urllib.parse,urllib.error,pathlib
          UA='ShioriArchive-CommonCrawl/0.2 (public URL metadata research; github.com/ponpains/radiko-transcriber2)'
          def get(u,timeout=55,retries=3):
            last=None
            for i in range(retries):
              try:
                with urllib.request.urlopen(urllib.request.Request(u,headers={'User-Agent':UA}),timeout=timeout) as r:return r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                last=e
                if e.code in (429,502,503,504):time.sleep(min(10*(i+1),30));continue
                break
              except Exception as e:
                last=e;time.sleep(min(5*(i+1),15))
            print('GET_ERR',type(last).__name__,last,u[:130]);return ''
          cols=json.loads(get('https://index.commoncrawl.org/collinfo.json',30))
          cols=[c for c in cols if re.match(r'CC-MAIN-20(19|20|21|22|23|24|25|26)-',c.get('id',''))]
          cols=sorted(cols,key=lambda c:c['id'])
          ids=set();rows=0;per={};errors=[]
          for c in cols:
            before=len(ids);cid=c['id'];y=int(cid[8:12])
            pats=['twitter.com/nagata_shiori_/status/*','www.twitter.com/nagata_shiori_/status/*','mobile.twitter.com/nagata_shiori_/status/*']
            if y>=2023:pats += ['x.com/nagata_shiori_/status/*','www.x.com/nagata_shiori_/status/*']
            for pat in pats:
              q=urllib.parse.urlencode({'url':pat,'output':'json','filter':'status:200','collapse':'urlkey'})
              text=get(c['cdx-api']+'?'+q)
              if not text:continue
              for line in text.splitlines():
                try:o=json.loads(line)
                except:continue
                rows+=1;u=o.get('url','')
                m=re.search(r'(?:twitter|x)\.com/nagata_shiori_/(?:status|statuses)/(\d{15,22})',u,re.I)
                if m:ids.add(m.group(1))
              time.sleep(.12)
            add=len(ids)-before
            per[cid]=add
            print('CC',cid,'NEW',add,'TOTAL',len(ids))
          pathlib.Path('/tmp/commoncrawl_ids.txt').write_text('\n'.join(sorted(ids,key=int)),encoding='utf-8')
          pathlib.Path('/tmp/commoncrawl_report.json').write_text(json.dumps({'collections':len(cols),'rows':rows,'unique_status_ids':len(ids),'per_collection':per},indent=2),encoding='utf-8')
          print('COMMONCRAWL_FINAL',json.dumps({'collections':len(cols),'rows':rows,'unique_status_ids':len(ids)}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: commoncrawl-nagata-x-ids-full
          path: |
            /tmp/commoncrawl_ids.txt
            /tmp/commoncrawl_report.json
