name: Build Shiori Archive APK (legacy v0.7)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate bundled archive data
        shell: bash
        run: |
          python3 shiori-archive/scripts/generate_archive.py
          test -s shiori-archive/app/src/main/assets/archive_seed.json
          cat shiori-archive/app/src/main/assets/archive_build_report.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable debug signing key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          text = pathlib.Path('.github/workflows/build-apk.yml').read_text()
          line = next((x.strip() for x in text.splitlines() if x.strip().startswith("echo '") and 'base64 --decode > debug.keystore' in x), None)
          if not line:
              raise SystemExit('stable debug key payload not found')
          payload = line.split("echo '", 1)[1].split("' | base64", 1)[0]
          pathlib.Path('shiori-archive/debug.keystore').write_bytes(base64.b64decode(payload))
          PY
          keytool -list -keystore shiori-archive/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle -p shiori-archive :app:assembleDebug

      - name: Verify package
        shell: bash
        run: |
          APK=shiori-archive/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -5

      - name: Upload APK and archive report
        uses: actions/upload-artifact@v4
        with:
          name: shiori-archive-v0.7.0-apk
          path: |
            shiori-archive/app/build/outputs/apk/debug/app-debug.apk
            shiori-archive/app/src/main/assets/archive_build_report.json
