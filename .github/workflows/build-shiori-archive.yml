name: Build Shiori Archive APK

on:
  push:
    branches: [ "shiori-archive-mvp" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare bundled archive data
        shell: bash
        run: |
          mkdir -p shiori-archive/app/src/main/assets
          python3 - <<'PY'
          import hashlib, html as htmllib, json, re, urllib.request
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          base = Path('shiori-archive/data')
          manifest = json.loads((base / 'manifest.json').read_text(encoding='utf-8'))
          merged = {}
          for name in manifest.get('files', []):
              if '/' in name or '..' in name or not name.endswith('.json'):
                  raise SystemExit(f'unsafe shard name: {name}')
              shard = json.loads((base / name).read_text(encoding='utf-8'))
              for event in shard.get('events', []):
                  event_id = str(event.get('id', '')).strip()
                  if event_id:
                      merged[event_id] = event

          # Public fan-maintained topic index: discovery only, clearly labelled secondary.
          generated = 0
          try:
              req = urllib.request.Request(
                  'https://raw.githubusercontent.com/nagata-shiohigari/shiorin/main/index.html',
                  headers={'User-Agent': 'ShioriArchive-build/0.5.1 (+public metadata indexer)'}
              )
              raw = urllib.request.urlopen(req, timeout=15).read().decode('utf-8', errors='replace')
              section_labels = {
                  'books':'本・ブログ','movies':'映画・ドラマ','gourmet':'グルメ','makeup':'メイク・ファッション',
                  'characters':'キャラクター','events':'イベント','spots':'場所','people':'人物','items':'アイテム','personal':'パーソナル',
                  'radio':'ラジオ','music':'音楽'
              }
              date_re = re.compile(r'(?<!\d)(\d{2})/(\d{1,2})/(\d{1,2})(?!\d)')
              tag_re = re.compile(r'<[^>]+>')
              for sec in re.finditer(r'<section\s+id="([^"]+)"[^>]*>(.*?)</section>', raw, flags=re.S|re.I):
                  sec_id, body = sec.group(1), sec.group(2)
                  label = section_labels.get(sec_id, sec_id)
                  for li in re.findall(r'<li\b[^>]*>(.*?)</li>', body, flags=re.S|re.I):
                      text = htmllib.unescape(tag_re.sub('', li))
                      text = re.sub(r'\s+', ' ', text).strip()
                      matches = list(date_re.finditer(text))
                      if not matches:
                          continue
                      first = matches[0]
                      title = text[:first.start()].rstrip('（(、,。 ')
                      title = re.sub(r'\s+', ' ', title).strip()
                      if not title:
                          continue
                      if len(title) > 76:
                          title = title[:73] + '…'
                      for idx, m in enumerate(matches):
                          y, mo, d = 2000+int(m.group(1)), int(m.group(2)), int(m.group(3))
                          if not (2019 <= y <= 2026 and 1 <= mo <= 12 and 1 <= d <= 31):
                              continue
                          next_pos = matches[idx+1].start() if idx+1 < len(matches) else len(text)
                          around = text[m.end():next_pos]
                          if 'SHOWROOM' in around or 'SHOWROOM' in text[m.start():m.start()+70]: typ='SHOWROOM'
                          elif 'Instagram' in around or 'Instagram' in text[m.start():m.start()+70]: typ='Instagram'
                          elif re.search(r'(^|\s)X($|\s|\)|）)', around): typ='X'
                          elif 'けれけれ' in around or 'ノイミーステーション' in around or 'FAV FOUR' in around or 'ラジオ' in around: typ='ラジオ'
                          elif 'YouTube' in around or 'イコノイジョイチャンネル' in around: typ='YouTube'
                          else: typ='発言索引'
                          date = f'{y:04d}-{mo:02d}-{d:02d}'
                          digest = hashlib.sha1(f'{sec_id}|{date}|{title}'.encode()).hexdigest()[:12]
                          event_id = f'fanidx-{date}-{digest}'
                          if event_id in merged:
                              continue
                          merged[event_id] = {
                              'id': event_id, 'date': date, 'time': '', 'type': typ,
                              'title': title,
                              'summary': f'{label}として日付付きで整理されている話題。一次資料を確認できたものは今後そちらへ差し替えます。',
                              'sourceName': '永田詩央里ちゃん情報局（非公式索引）',
                              'sourceUrl': 'https://nagata-shiohigari.github.io/shiorin/',
                              'confidence': '二次索引・要一次照合',
                              'tags': [label, typ, '日付付き索引'], 'people': []
                          }
                          generated += 1
          except Exception as e:
              print('secondary index generation skipped:', repr(e))

          # X backfill: collect public original-post IDs without copying post bodies.
          # Snowflake IDs contain the exact post timestamp; convert that to JST.
          X_EPOCH_MS = 1288834974657
          JST = timezone(timedelta(hours=9))
          now_jst = datetime.now(JST)
          x_ids = set()
          fallback_ids = {
              '2089705246159495323', # 2026-08-18
              '2091145287582773654', # 2026-08-22
              '2091155599409201244', # 2026-08-22
              '2091503711587844256', # 2026-08-23
              '2094013097799541111', # 2026-08-30
              '2095278673507303712', # 2026-09-03
          }
          x_ids.update(fallback_ids)

          id_re = re.compile(r'(?:twitter|x)\.com/nagata_shiori_/status/(\d{15,22})', re.I)
          escaped_re = re.compile(r'nagata_shiori_(?:%2F|\\/|/)status(?:%2F|\\/|/)(\d{15,22})', re.I)

          # Blogara exposes links back to original Twitter/X posts in its public update list.
          blogara_found = 0
          for page in range(1, 16):
              url = f'https://blogara.jp/t/equal-love/sp{page}.html'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 ShioriArchive/0.5.1'})
                  text = urllib.request.urlopen(req, timeout=12).read().decode('utf-8', errors='replace')
                  before = len(x_ids)
                  x_ids.update(id_re.findall(text))
                  x_ids.update(escaped_re.findall(text))
                  blogara_found += len(x_ids)-before
              except Exception as e:
                  print('blogara page skipped:', url, repr(e))
                  break

          # Extra mirrors are best-effort fallbacks only.
          mirrors = ['https://www.sotwe.com/nagata_shiori_','https://twstalker.com/nagata_shiori_']
          status_patterns = [
              re.compile(r'(?:https?://(?:x|twitter)\.com/)?nagata_shiori_/status/(\d{15,22})', re.I),
              re.compile(r'nagata_shiori_%2Fstatus%2F(\d{15,22})', re.I),
              re.compile(r'nagata_shiori_\\/status\\/(\d{15,22})', re.I),
          ]
          for mirror in mirrors:
              try:
                  req = urllib.request.Request(mirror, headers={'User-Agent':'Mozilla/5.0 ShioriArchive/0.5.1'})
                  text = urllib.request.urlopen(req, timeout=12).read().decode('utf-8', errors='replace')
                  for pat in status_patterns:
                      x_ids.update(pat.findall(text))
              except Exception as e:
                  print('x mirror skipped:', mirror, repr(e))

          existing_status_ids = set()
          for e in merged.values():
              u = str(e.get('sourceUrl',''))
              m = re.search(r'(?:twitter|x)\.com/nagata_shiori_/status/(\d{15,22})', u, re.I)
              if m:
                  existing_status_ids.add(m.group(1))

          generated_x = 0
          latest_seen_x = None
          latest_added_x = None
          for sid in sorted(x_ids, key=int):
              try:
                  created_ms = (int(sid) >> 22) + X_EPOCH_MS
                  dt = datetime.fromtimestamp(created_ms / 1000, tz=timezone.utc).astimezone(JST)
              except Exception:
                  continue
              if dt.year < 2019 or dt > now_jst + timedelta(days=1):
                  continue
              if latest_seen_x is None or dt > latest_seen_x:
                  latest_seen_x = dt
              if sid in existing_status_ids:
                  continue
              event_id = f'x-live-{sid}'
              if event_id in merged:
                  continue
              source_url = f'https://x.com/nagata_shiori_/status/{sid}'
              merged[event_id] = {
                  'id': event_id,
                  'date': dt.strftime('%Y-%m-%d'),
                  'time': dt.strftime('%H:%M'),
                  'type': 'X',
                  'title': 'X投稿',
                  'summary': '本人Xアカウントの公開投稿。本文・画像は元投稿リンクから確認できます。',
                  'sourceName': '永田詩央里 公式X',
                  'sourceUrl': source_url,
                  'confidence': '本人X投稿URL',
                  'tags': ['X','本人投稿'],
                  'people': []
              }
              existing_status_ids.add(sid)
              generated_x += 1
              if latest_added_x is None or dt > latest_added_x:
                  latest_added_x = dt

          output = {
              'schemaVersion': 1,
              'updatedAt': datetime.now(JST).strftime('%Y-%m-%d %H:%M'),
              'notice': '公開・適法に確認できる情報の日時、短い要約、タグ、出典URLを収録。二次索引はその旨を明示。記録なしは活動なしを意味しません。X投稿は本文を複製せず、日時と元投稿リンクを収録します。',
              'events': list(merged.values()),
          }
          out = Path('shiori-archive/app/src/main/assets/archive_seed.json')
          out.write_text(json.dumps(output, ensure_ascii=False, indent=2), encoding='utf-8')
          print(f'generated secondary dated facts: {generated}')
          print(f'blogara x ids added to candidate set: {blogara_found}')
          print(f'found x status ids: {len(x_ids)}')
          print(f'generated x metadata: {generated_x}')
          print('latest x candidate:', latest_seen_x.isoformat() if latest_seen_x else 'none')
          print('latest newly added x:', latest_added_x.isoformat() if latest_added_x else 'none')
          print(f'bundled events: {len(merged)}')
          PY

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Restore stable debug signing key
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          text = pathlib.Path('.github/workflows/build-apk.yml').read_text()
          line = next((x.strip() for x in text.splitlines() if x.strip().startswith("echo '") and 'base64 --decode > debug.keystore' in x), None)
          if not line:
              raise SystemExit('stable debug key payload not found')
          payload = line.split("echo '", 1)[1].split("' | base64", 1)[0]
          pathlib.Path('shiori-archive/debug.keystore').write_bytes(base64.b64decode(payload))
          PY
          keytool -list -keystore shiori-archive/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle -p shiori-archive :app:assembleDebug

      - name: Verify package
        shell: bash
        run: |
          APK=shiori-archive/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shiori-archive-v0.5.1-apk
          path: shiori-archive/app/build/outputs/apk/debug/app-debug.apk
