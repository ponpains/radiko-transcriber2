name: Inspect public X mirror pagination
on:
  workflow_dispatch:
  push:
    branches: ["shiori-archive-mvp"]
    paths: ['.github/workflows/inspect-social-mirrors-x.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Sotwe HTML and scripts
        run: |
          python3 - <<'PY'
          import re,urllib.request,html,json
          u='https://www.sotwe.com/nagata_shiori_'
          ua='Mozilla/5.0 ShioriArchive mirror-inspect/0.2'
          req=urllib.request.Request(u,headers={'User-Agent':ua,'Accept-Language':'ja,en;q=0.8'})
          with urllib.request.urlopen(req,timeout=30) as r:body=r.read().decode('utf-8','replace')
          dec=html.unescape(body)
          print('BYTES',len(body))
          nums=set(re.findall(r'(?<!\d)(\d{15,22})(?!\d)',dec))
          print('ALL_LONG_NUMBERS',len(nums),sorted(nums)[-30:])
          # Print snippets around likely timeline/pagination machinery, keeping log bounded.
          for term in ['pagination','loadmore','load more','next','timeline','cursor','page=','offset','api/','tweet','post_id','tweet_id','user_id','nagata_shiori_']:
            hits=[m.start() for m in re.finditer(re.escape(term),dec,re.I)]
            print('\nTERM',term,'HITS',len(hits))
            for pos in hits[:8]:
              s=re.sub(r'\s+',' ',dec[max(0,pos-280):pos+500])
              print('SNIP',s[:780])
          scripts=re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',dec,re.I)
          print('\nSCRIPT_SRCS',scripts)
          forms=re.findall(r'<form[^>]+action=["\']([^"\']+)["\']',dec,re.I)
          print('FORM_ACTIONS',forms)
          # Look for JS endpoints and query templates.
          endpoints=set(re.findall(r'["\']([^"\']*(?:api|ajax|timeline|tweet|load|page|cursor)[^"\']*)["\']',dec,re.I))
          print('ENDPOINT_LIKE',sorted(endpoints)[:120])
          # Fetch local JS assets and grep for endpoint construction.
          from urllib.parse import urljoin
          for src in scripts[:12]:
            su=urljoin(u,src)
            try:
              with urllib.request.urlopen(urllib.request.Request(su,headers={'User-Agent':ua}),timeout=25) as rr:js=rr.read().decode('utf-8','replace')
              print('\nJS',su,'BYTES',len(js))
              for term in ['cursor','loadMore','pagination','timeline','tweet','api/','offset','page']:
                hs=[m.start() for m in re.finditer(term,js,re.I)]
                if hs:
                  print(' JS_TERM',term,len(hs))
                  for p in hs[:5]:print('  ',re.sub(r'\s+',' ',js[max(0,p-180):p+380])[:560])
            except Exception as e:print('JS_ERR',su,repr(e))
          PY
